# One file a machine staged (a presigned URL of the bucket it wrote to) attached to a GitHub release as an asset, so
# no byte of it passes through the machine that asks: fetched here, checked against its sha256, uploaded without
# overwriting an asset of another content, and read back anonymously as every reader reads it. Its callers: this
# store's upload.yml (a recorded fixture, into the open store-N release) and Dew's JAX fork's attach-plugin.yml (a
# build node's wheels, into plugin-VERSION), each choosing the release; the release exists, published. A caller masks
# the URL before this action: the runner prints an action's inputs before its steps run, this one's mask among them.
name: attach
description: A staged file fetched, checked, attached to a release and read back

inputs:
  url:
    description: the staged file's presigned URL
    required: true
  sha256:
    description: the file's SHA-256
    required: true
  asset:
    description: the asset's name in the release
    required: true
  release:
    description: the release's tag
    required: true
  repository:
    description: the repository holding the release
    required: true
  token:
    description: a token that may write the repository's releases
    required: true

runs:
  using: composite
  steps:
    - name: Fetch, check, attach, read back
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        URL: ${{ inputs.url }}
        SHA256: ${{ inputs.sha256 }}
        ASSET: ${{ inputs.asset }}
        RELEASE: ${{ inputs.release }}
        REPOSITORY: ${{ inputs.repository }}
      run: |
        set -euo pipefail
        echo "::add-mask::$URL"
        [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no sha256: $SHA256"; exit 1; }
        [[ "$ASSET" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]] || { echo "::error::no asset name: $ASSET"; exit 1; }
        [[ "$RELEASE" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "::error::no release tag: $RELEASE"; exit 1; }
        file="$RUNNER_TEMP/$ASSET"
        # Held already: taken only at its sha256, never replaced (a run again after a part of it attached).
        held=$(gh api "repos/$REPOSITORY/releases/tags/$RELEASE" --jq ".assets[] | select(.name == \"$ASSET\") | .digest")
        if [ -n "$held" ]; then
          [ "$held" = "sha256:$SHA256" ] || { echo "::error::$ASSET is held in $RELEASE at other bytes: $held"; exit 1; }
        else
          curl -fsSL --retry 3 -o "$file" "$URL"
          echo "$SHA256  $file" | sha256sum -c --quiet || { echo "::error::the fetched file is not $SHA256"; exit 1; }
          gh release upload "$RELEASE" "$file" --repo "$REPOSITORY"
          rm -f "$file"
        fi
        curl -fsSL --retry 3 -o "$file" "https://github.com/$REPOSITORY/releases/download/$RELEASE/$ASSET"
        echo "$SHA256  $file" | sha256sum -c --quiet || { echo "::error::$ASSET read back is not $SHA256"; exit 1; }
        rm -f "$file"
        echo "$ASSET held at $RELEASE" >> "$GITHUB_STEP_SUMMARY"
